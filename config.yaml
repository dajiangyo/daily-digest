# 每日排行与 AI 速览 · 配置文件
# 改这个文件就能调整行为，不需要动代码。

# 最终进榜单的条目数（单栏模式用；多栏模式见下方 sections）
top_n: 30

# --------------------------------------------------------------------------- #
# 数据源
# --------------------------------------------------------------------------- #
# 五种类型：
#   github_trending  GitHub 每日 Trending（当天新增 star）
#   github_search    GitHub 仓库搜索（按总 star 追某个话题）
#   hackernews       Hacker News 榜单
#   generic_html     任意站点列表页（写 CSS 选择器）
#   json_api         任意 JSON 接口（写点号路径）
#
# 通用字段：
#   enabled: false  临时关掉某个源而不删配置
#   section: xxx    归到哪个分栏（对应下方 sections 的 id），默认 main
sources:
  # ---- GitHub Trending（无需密钥）----
  - type: github_trending
    name: GitHub Trending · 全语言
    since: daily            # daily / weekly / monthly
    section: main
    enabled: true

  - type: github_trending
    name: GitHub Trending · Python
    since: daily
    language: python
    section: main
    enabled: true

  - type: github_trending
    name: GitHub Trending · TypeScript
    since: daily
    language: typescript
    section: main
    enabled: true

  # ---- Hacker News（官方 API，无需密钥）----
  - type: hackernews
    name: Hacker News
    endpoint: topstories    # topstories / beststories / newstories
    limit: 25
    section: main
    enabled: true

  # ---- 示例：追某个话题的高星项目 ----
  # Trending 只反映「当天新增 star」，成熟但冷门的项目永远上不了榜。
  # 想追话题就用搜索接口，按总 star 排序。改 query 即可换话题。
  #
  # 覆盖范围不重叠的检索要拆成多个源（搜索 API 不支持跨限定符的 OR），
  # 再靠跨分栏去重合并成一份榜单。
  #
  # 常用写法：
  #   topic:xxx                          作者主动打了标签的，最规范
  #   "xxx in:name,description"          名字或简介里提到关键词的，覆盖更广
  #   org:xxx                            某个组织下的全部仓库
  #   topic:xxx pushed:>=2025-01-01      叠加活跃度过滤
  - type: github_search
    name: 话题追踪 · 示例
    query: "topic:stable-diffusion"
    sort: stars             # stars / updated / forks
    limit: 40               # 最大 100
    min_stars: 0            # 客户端过滤，低于该星数丢弃
    # pushed_within_days: 365   # 可选：只留最近 N 天有推送的
    section: main
    enabled: false          # 想用就改成 true

  # ---- 示例：任意 JSON 接口 ----
  # 以「开发者的头条」dev.to 为例，字段路径按需修改。
  - type: json_api
    name: dev.to
    url: https://dev.to/api/articles
    params:
      top: 7
      per_page: 20
    list_path: ""           # 顶层就是数组；嵌套写 "data.items"
    title_key: title
    url_key: url
    score_key: positive_reactions_count
    desc_key: description
    enabled: false          # 想用就改成 true

  # ---- 示例：任意列表页 ----
  # 站点改版只需要改下面的选择器。
  - type: generic_html
    name: 自定义站点
    url: https://example.com/list
    base_url: https://example.com
    item_selector: "div.item"
    title_selector: "a.title"
    link_selector: "a.title"
    score_selector: "span.score"
    desc_selector: "p.desc"
    limit: 20
    enabled: false

# --------------------------------------------------------------------------- #
# 分栏（产物里每个分栏是一个独立榜单）
# --------------------------------------------------------------------------- #
# 不写这一段就退化成单栏「完整排行」，与旧版行为一致。
# id 要和上面 sources 里的 section 对应。
#
# merge 决定这一栏怎么排序：
#   rotate（默认）—— 各源轮转交错。用于栏内源量纲不同的情况（Trending 当日
#                    新增 star vs HN 点赞数），否则条目多的大源会刷屏。
#   score         —— 直接按分数降序。用于栏内源量纲相同的情况（例如都用
#                    github_search，分数都是 GitHub 总星标），轮转反而会
#                    打乱真实排名。
#
# 一句话选法：同一栏里分数能直接比大小 → score；不能比 → rotate。
sections:
  - id: main
    title: 综合排行
    top_n: 24
    merge: rotate

# 想再加一栏独立榜单，复制上面三行改 id / title / top_n 即可，
# 并把新源的 section 指到这个 id。

# --------------------------------------------------------------------------- #
# 排名权重（可选）
# --------------------------------------------------------------------------- #
# 键是源的 name，值是该源在轮转合并时每轮多拿的名额。
rank:
  weights: {}
  #  weights:
  #    Hacker News: 2

# --------------------------------------------------------------------------- #
# AI 总结
# --------------------------------------------------------------------------- #
# base_url / api_key 走环境变量 LLM_BASE_URL / LLM_API_KEY（Actions 里放 secrets）
# 不配置也能跑，会降级为模板摘要。
llm:
  model: deepseek-chat      # deepseek-chat / gpt-4o-mini / moonshot-v1-8k / qwen-plus ...
  temperature: 0.3

# --------------------------------------------------------------------------- #
# 输出
# --------------------------------------------------------------------------- #
output:
  docs_dir: docs            # Pages 部署目录
  data_dir: data            # Markdown / JSON 归档目录
  archive: true             # 是否保留历史归档

# --------------------------------------------------------------------------- #
# 推送
# --------------------------------------------------------------------------- #
# 渠道开关全部由环境变量决定，这里只控制推送内容长度。
notify:
  top_n: 8                  # 每个分栏默认列出几条
  sections:                 # 可给某个分栏单独指定条数（键是分栏 id）
    main: 8
